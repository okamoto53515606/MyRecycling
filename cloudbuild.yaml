steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      # ベースイメージの修正（Node.js のセキュリティ更新）を確実に取り込むため毎回 pull する
      - '--pull'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID'
      - '--build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_NEXT_PUBLIC_GOOGLE_CLIENT_ID'
      - '--build-arg=NEXT_PUBLIC_STRIPE_PUBLIC_KEY=$_NEXT_PUBLIC_STRIPE_PUBLIC_KEY'
      - '-t'
      - '${_IMAGE_TAG}'
      - '.'

  # ビルドしたイメージの Node.js バージョンを記録し、セキュリティ修正前なら失敗させる
  # node:24-slim はフローティングタグのため、意図せず旧パッチに戻った場合に検知する
  # 判定条件は 24.22.3 以上（24 系）。22 系を使う場合は 22.23.5 以上が必要
  # （2026-11-11 のセキュリティリリース: HTTP/2・TLS・HTTPS の high 7件ほか計16件）
  - name: 'gcr.io/cloud-builders/docker'
    id: 'check-node-version'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'node'
      - '${_IMAGE_TAG}'
      - '-e'
      - 'const v=process.versions.node.split(".").map(Number);const ok=v[0]>24||(v[0]===24&&(v[1]>22||(v[1]===22&&v[2]>=3)));console.log("runtime Node.js:",process.versions.node);if(!ok){console.error("ERROR: セキュリティ修正前の Node.js です（24.22.3 以上が必要）");process.exit(1)}'
images:
  - '${_IMAGE_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
